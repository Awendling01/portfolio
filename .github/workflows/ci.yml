name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel older runs on the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — pnpm/action-setup@v4 reads the version from
      # `packageManager` in package.json. Passing both fails the step
      # because the action wants one source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Build runs without secrets — env-var-dependent code paths are guarded
      # so a missing DATABASE_URL/RESEND_API_KEY still produces a clean build.
      - name: Build
        run: pnpm build
